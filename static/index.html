<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dapple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="app" id="app">

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo" aria-label="Dapple">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
        <path d="M8 14a4 4 0 0 1 8 0v2a4 4 0 0 1-8 0v-2z"/>
        <path d="M4 14h16"/>
        <path d="M4 10h16"/>
        <circle cx="12" cy="12" r="2"/>
      </svg>
      <span class="logo-text">Dapple</span>
      <span class="version">1.0</span>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="section-label">Model</div>
    <div class="model-list" id="model-list"></div>
  </div>

  <div class="sidebar-section">
    <div class="section-label">Status</div>
    <div class="status-card" id="status-card">
      <div class="status-row">
        <span class="status-label">GPU</span>
        <span class="status-value" id="status-gpu">--</span>
      </div>
      <div class="status-row">
        <span class="status-label">VRAM</span>
        <span class="status-value" id="status-vram">--</span>
      </div>
      <div class="status-row">
        <span class="status-label">Model</span>
        <span class="status-value" id="status-model">None loaded</span>
      </div>
      <div class="status-row">
        <span class="status-label">Cache</span>
        <span class="status-value" id="status-cache">--</span>
      </div>
    </div>
  </div>
</aside>

<main class="main">
  <div class="main-content">

    <div class="output-panel" id="output-panel">
      <div class="output-placeholder" id="output-placeholder">
        <svg class="placeholder-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <p class="placeholder-text">Generated images will appear here</p>
        <p class="placeholder-sub">Select a model and enter a prompt to begin</p>
      </div>

      <div class="gen-loading u-hidden" id="gen-loading"></div>

      <div class="output-result u-hidden" id="output-result">
        <div class="result-header">
          <span class="result-label" id="result-label"></span>
          <button class="btn-icon" id="btn-folder" title="Open folder" aria-label="Open folder">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
        </div>
        <div class="result-image-wrapper">
          <img class="result-image" id="result-image" alt="Generated">
        </div>
        <div class="result-meta" id="result-meta"></div>
      </div>
    </div>

    <form class="prompt-form" id="prompt-form" autocomplete="off">
      <div class="prompt-input-wrapper">
        <textarea
          class="prompt-input"
          id="prompt-input"
          rows="1"
          placeholder="Describe the image you want to generate..."
          spellcheck="false"
        ></textarea>
        <button
          class="btn-send"
          id="btn-send"
          type="submit"
          aria-label="Generate image"
          title="Generate"
          disabled
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 22 12 12 22 2 12"/>
          </svg>
        </button>
      </div>
      <div class="prompt-advanced u-hidden" id="prompt-advanced">
        <div class="advanced-row">
          <label class="field-label" for="negative-prompt">Negative prompt</label>
          <input
            type="text"
            class="field-input"
            id="negative-prompt"
            placeholder="What you don't want in the image..."
            spellcheck="false"
          >
        </div>
        <div class="advanced-row advanced-controls">
          <div class="control-group">
            <label class="field-label" for="param-steps">Steps</label>
            <input type="number" class="field-input field-narrow" id="param-steps" value="4" min="1" max="100">
          </div>
          <div class="control-group">
            <label class="field-label" for="param-guidance">Guidance</label>
            <input type="number" class="field-input field-narrow" id="param-guidance" value="0" min="0" max="20" step="0.5">
          </div>
          <div class="control-group">
            <label class="field-label" for="param-seed">Seed</label>
            <input type="number" class="field-input field-narrow" id="param-seed" value="-1" min="-1" placeholder="Random">
          </div>
        </div>
      </div>
      <div class="prompt-actions">
        <button type="button" class="btn-text" id="btn-toggle-advanced" aria-label="Toggle advanced options">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"/>
            <line x1="4" y1="10" x2="4" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12" y2="3"/>
            <line x1="20" y1="21" x2="20" y2="16"/>
            <line x1="20" y1="12" x2="20" y2="3"/>
            <line x1="1" y1="14" x2="7" y2="14"/>
            <line x1="9" y1="8" x2="15" y2="8"/>
            <line x1="17" y1="16" x2="23" y2="16"/>
          </svg>
          <span>Advanced</span>
        </button>
        <div class="config-status">
          <span class="config-badge" id="config-badge">none</span>
          <span class="config-badge" id="size-badge">1024x1024</span>
        </div>
      </div>
    </form>

  </div>
</main>

</div>

<div class="toast-container" id="toast-container"></div>

<script src="/static/app.js"></script>
</body>
</html>
